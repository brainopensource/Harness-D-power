[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sagiha"
version = "0.1.0"
description = "SOTA autonomous coding harness with microkernel, capability security, and verification gates"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.10,<3",          # domain models + config validation, all port boundaries
  "anyio>=4.6",                 # structured concurrency, portable task groups
  "httpx>=0.28",                # HTTP for providers and MCP HTTP-SSE
  "typer>=0.15",                # CLI
  "rich>=13.9",                 # TUI rendering, diff display
  "structlog>=24.4",            # structured logging bridged to OTel
  "tree-sitter>=0.23",          # AST parsing
  "tree-sitter-language-pack>=0.7",   # bundled grammars, avoids per-language pins
  "email-validator>=2.3.0",
  "pyyaml>=6.0",                 # workflow/manifest topologies are YAML (schemas_and_contracts.md)
  "jsonschema>=4.20",            # structural half of the topology validator (TASK-020)
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]     # cache_control prompt caching, extended thinking
google    = ["google-genai>=0.1"]   # unified Google SDK
openai    = ["openai>=1.50"]        # GPT-*, plus every OpenAI-compatible endpoint
indexing  = [
  "watchfiles>=0.24",           # file-watch driven incremental re-index (Block 4)
  "lsprotocol>=2023.0",         # typed LSP messages (Block 4)
]
mcp       = ["mcp>=1.0"]            # official MCP SDK, stdio + HTTP-SSE (Block 5, explicitly deferred)
otel      = [
  "opentelemetry-sdk>=1.29",
  "opentelemetry-exporter-otlp>=1.29",
]
dev       = [
  "pytest>=8.3",              # conformance suites; floor matches ADR-0009
  "pytest-asyncio>=0.24",     # parametrized async fixtures
  "pytest-cov>=5.0",          # backs the coverage_not_decreased gate
  "respx>=0.22.0",            # mock HTTP endpoints in unit tests
  "ruff>=0.8.0",              # lint + format
  "pyright>=1.1.380",         # blocking type gate
  "mypy>=1.13",               # advisory second opinion, non-blocking (ADR-0009)
  "import-linter>=2.0",       # CAR layer contracts
  "detect-secrets>=1.5.0",    # pre-commit secret scan
]

[project.scripts]
sagiha = "sagiha.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sagiha", "src/aether"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "podman: requires rootless Podman and the sagiha/runtime:latest image (v2-S5 perimeter)",
  "container: requires a container runtime and aether/eval:build (B3 perimeter, TASK-016)",
  "live: requires a live local OpenAI-compatible endpoint on :11434 (B2b perimeter)",
]

[tool.pyright]
# Scope matches the literal requirement in docs/implementation/contracts-to-code.md: "pyright
# strict passes on src/sagiha/domain/ and src/sagiha/ports/ with zero suppressions." tests/ is
# exercised by pytest, not gated on strict typing — dynamic introspection code (walking
# Protocols via inspect/typing) is inherently hard to type strictly and that is not a defect.
# Scoped to src/sagiha and src/aether, not src/: the vendored reference harnesses
# (src/claude_code, src/grok_build, src/hermes_agent, src/open_code) are
# third-party trees and produce ~400k strict errors that drown the signal.
include = ["src/sagiha", "src/aether"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
# Pydantic's documented discriminated-union pattern — a subclass narrowing a base field from
# `str` to `Literal["..."]` with a default — is exactly how domain/events.py's Event hierarchy
# works. Pydantic validates this safely at runtime; pyright's static override-compatibility
# check cannot see that and flags every subclass as unsound variance. This is a known, narrow
# false positive for this specific pattern, not a suppression of a real defect.
reportIncompatibleVariableOverride = false

[tool.ruff]
target-version = "py313"
line-length = 110
src = ["src", "tests"]
# Same rationale as the pyright `include` above: the vendored reference
# harnesses are third-party trees, not this project's code, and linting them
# drowns the signal (16 of the baseline's 34 errors came from aether_examples
# alone). Project files are never excluded to make a gate green — keep_alive.py
# and scripts/extract_gemini_share.py were fixed, not silenced.
extend-exclude = [
    ".sagiha",
    "aether_examples",
    "src/claude_code",
    "src/claude_refs",
    "src/codex_cli",
    "src/grok_build",
    "src/hermes_agent",
    "src/hermes_self_evolution",
    "src/open_code",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/sagiha/cli.py" = ["B008"]
# core_skeletons_and_protocols.md §8 specifies WorkflowStep via classic TypeVar +
# Generic[In, Out], not PEP 695 type params — kept literal to the skeleton, and
# because In/Out need to stay importable module-level names for the reflection
# test (PEP 695 type params are not module attributes).
"src/aether/workflow/step.py" = ["UP046"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["sagiha", "aether"]
mypy_path = "src"

[tool.coverage.run]
source = ["src/sagiha", "src/aether"]

[tool.coverage.report]
# 80% is the project-wide floor. sagiha/kernel/policy and sagiha/domain carry a
# 95% floor instead — coverage.py has no per-path threshold, so that stricter
# bound is checked separately in CI once those packages have real content.
# See docs/06-guides-and-patterns/ci-and-quality-gates.md.
fail_under = 80
exclude_also = ["if TYPE_CHECKING:"]

[dependency-groups]
dev = [
    "python-dotenv>=1.2.2",
]

