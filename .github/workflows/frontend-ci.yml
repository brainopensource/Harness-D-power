name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "src_front/apps/**"
      - "src_front/packages/**"
      - "src_front/*.json"
      - "src_front/*.yaml"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "src_front/apps/**"
      - "src_front/packages/**"
      - "src_front/*.json"
      - "src_front/*.yaml"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src_front
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src_front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, lint, typecheck, test
        run: pnpm turbo lint typecheck test build
