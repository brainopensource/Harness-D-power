name: CI & Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  tcb-check:
    name: Protect Trusted Computing Base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject TCB modifications from agent-authored branches
        run: |
          TCB_PATHS='src/sagiha/kernel/policy|src/sagiha/outer_loop/evaluator|benchmarks/definitions|\.github/workflows|\.importlinter'
          if git diff --name-only origin/main...HEAD | grep -qE "$TCB_PATHS"; then
            if [ "${{ github.event.pull_request.user.login }}" = "sagiha-agent" ]; then
              echo "::error::PR touches the trusted computing base"; exit 1
            fi
            echo "::warning::TCB touched — human review required"
          fi

  quality-gates:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv && uv pip install --system -e ".[dev]"
      # After `--system` install, use bare commands — `uv run` would create a separate venv
      # that may not see the system-editable install.
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: lint-imports
      - run: python scripts/gen_event_catalog.py --check
      # H3: an unimplemented method that returns a success-shaped value lies to its
      # caller. ContainerSandbox.apply_edit reported a landed edit for a file it never
      # opened, and the scaffolding suite pinned that as correct behaviour. Stdlib-only,
      # so it cannot break on a dependency change.
      - run: python scripts/check_loud_stubs.py
      # Advisory second opinion — never blocks. See ADR-0009.
      - run: mypy src/
        continue-on-error: true

  docs-budget:
    name: Docs Budget & Link Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Both scripts are stdlib-only by design — no `uv pip install` step, so this job
      # cannot be broken by a dependency resolution failure unrelated to docs.
      #
      # `--max` is a RATCHET — set to the 15,000 word ceiling specified by Sprint v2-S0.
      - run: python scripts/docs_budget.py --max 15000
      # PR-0a repaired seven dead links by hand and found 44 more. docs/STATUS.md was
      # deleted out from under four inbound references before anyone noticed; this is the
      # mechanical replacement for noticing.
      - run: python scripts/check_links.py

  conformance:
    name: Port Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv && uv pip install --system -e ".[dev]"
      # Runs every suite under tests/contracts/ as it lands — meta-conformance
      # (test_port_shape.py) today, per-port behavioral suites from S0 onward. Once every
      # port in the index has a suite, split this back into a per-port matrix job so one
      # port's regression doesn't obscure another's in the job summary.
      - run: pytest tests/contracts/ -v

  tests:
    name: Unit & E2E Tests (coverage gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv && uv pip install --system -e ".[dev]"
      # tests/unit/ carries the Sprint 3a exit test (test_sprint3a_e2e.py — cassette-driven
      # apply_edit through the dispatch choke point, gate-evaluated, replayed via digest
      # match) plus the path-containment security suite (D26/D27). Prior to this job neither
      # ran in CI; `fail_under = 80` in pyproject.toml was configured and never applied (D29).
      - run: pytest tests/ -v --cov=src/sagiha --cov-report=term-missing

  bench-aa:
    name: E0 A/A Noise Floor (v2-S4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv && uv pip install --system -e ".[dev]"
      # `benchmarks/definitions/s0-core.json` does not exist yet — populating it requires a
      # real harvest+validate pass and a recorded cassette, which is an operational step, not
      # a CI-authorable one (see docs/rationale/benchmarks/noise-floor.md). This job is a
      # no-op until that suite is committed, so it does not block on work nobody has done yet;
      # once the suite lands, drop the existence guard so the job runs unconditionally.
      # Bare `sagiha` after `--system` install (do not mix with `uv run`).
      - name: Run A/A calibration against the pinned suite, if committed
        run: |
          SUITE=benchmarks/definitions/s0-core.json
          if [ ! -f "$SUITE" ]; then
            echo "::notice::$SUITE not committed yet — skipping bench-aa (see noise-floor.md)"
            exit 0
          fi
          sagiha bench --suite "$SUITE" --mode replay --aa --runs 2 \
            --output docs/rationale/benchmarks/noise-floor.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-aa-report
          path: docs/rationale/benchmarks/noise-floor.md
          if-no-files-found: ignore

  replay:
    name: Replay Determinism Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv && uv pip install --system -e ".[dev]"
      # Exercises the real `sagiha replay` CLI contract (fixed from the placeholder
      # `--verify-all --fixtures` flags, which the command never defined — D28) against a
      # committed cassette generated by scripts/gen_replay_fixture.py. This proves the CLI
      # command itself works end-to-end in CI; the fuller claim in the Sprint 3 exit
      # sentence — a cassette-driven fix through the dispatch choke point, gate-evaluated —
      # is proven by test_sprint3a_e2e.py in the `tests` job above.
      # Bare `sagiha` after `--system` install (do not mix with `uv run`).
      - run: |
          sagiha replay verify --verify \
            --cassette tests/fixtures/replay_smoke/cassette.json \
            --workspace tests/fixtures/replay_smoke/workspace \
            --trajectory-db /tmp/ci_replay.db | tee /tmp/replay_output.txt
          grep -q replay_ok /tmp/replay_output.txt
