repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: ruff
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        pass_filenames: false
      - id: lint-imports
        name: lint-imports
        entry: lint-imports
        language: system
        pass_filenames: false
      - id: no-secrets
        name: detect-secrets
        entry: detect-secrets-hook
        language: system
