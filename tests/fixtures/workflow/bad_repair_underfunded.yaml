schema_version: "1.0.0"
topology_id: bad_repair_underfunded
description: "budget_per_iteration is smaller than the chain it funds — a silent no-op loop"
nodes:
  - { id: retrieve, kind: retrieve, budget: { wall_clock_ms: 1000 } }
  - { id: generate, kind: generate, budget: { wall_clock_ms: 1000 } }
  - { id: apply,    kind: apply,    budget: { wall_clock_ms: 1000 } }
  - { id: evaluate, kind: evaluate, budget: { wall_clock_ms: 900000, concurrency_slots: 1 } }
  - { id: repair,   kind: repair,   budget: { prompt_tokens: 90000 } }
edges:
  - { from: retrieve, to: generate }
  - { from: generate, to: apply }
  - { from: apply,    to: evaluate }
repair:
  from_node: evaluate
  via_nodes: [repair, apply]
  back_to: evaluate
  max_iterations: 3
  budget_per_iteration: { wall_clock_ms: 960000 }
