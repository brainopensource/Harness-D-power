[package]
name = "sagiha-gui"
version = "0.1.0"
description = "SAGIHA mock-phase GUI cockpit"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "sagiha-gui"
path = "src/main.rs"
